<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat P2P Automático (Salas Multi-usuário)</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #0d1117;
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 20px 10px;
    box-sizing: border-box;
  }
  h2 { color: #58a6ff; margin-bottom: 10px; }
  #status {
    font-size: 13px;
    background: #21262d;
    padding: 8px 12px;
    border-radius: 5px;
    margin-bottom: 15px;
    width: 100%;
    max-width: 400px;
    text-align: center;
  }
  #chat {
    width: 100%;
    max-width: 400px;
    height: 50vh;
    background: #161b22;
    border-radius: 10px;
    padding: 10px;
    overflow-y: auto;
    margin-bottom: 10px;
    box-shadow: 0 0 10px #000;
  }
  input, button {
    padding: 10px;
    border: none;
    border-radius: 5px;
    font-size: 16px;
    box-sizing: border-box;
  }
  #msg {
    flex-grow: 1;
    background-color: #f0f6fc;
  }
  button {
    background: #238636;
    color: white;
    cursor: pointer;
    width: 80px;
    margin-left: 5px;
  }
  button:hover { background: #2ea043; }
  .msg {
    background: #21262d;
    padding: 6px 10px;
    border-radius: 5px;
    margin: 5px 0;
    word-wrap: break-word;
    font-size: 14px;
  }
  .nome { color: #58a6ff; font-weight: bold; }
  .sistema { color: #8b949e; font-style: italic; }
  .campo-msg {
    display: flex;
    width: 100%;
    max-width: 400px;
  }
</style>
</head>
<body>
  <h2>💬 Chat P2P Global</h2>
  <div id="status">Conectando à rede...</div>
  <div id="chat"></div>

  <div class="campo-msg">
    <input id="msg" placeholder="Digite sua mensagem..." type="text">
    <button onclick="enviar()">Enviar</button>
  </div>

<script>
  // ID fixo conhecido por todos os clientes
  const FIXED_ROOM_ID = "CHAT_ROOM_PUBLIC_GLOBAL_2026";

  const chat = document.getElementById("chat");
  const statusDiv = document.getElementById("status");
  const msgInput = document.getElementById("msg");

  let nome = prompt("Digite seu nome:") || "Anônimo";
  let peer;
  let isHost = false;

  // Guarda todas as conexões caso você seja o Host (Servidor)
  const conexoesAtivas = []; 
  // Guarda a conexão com o Host caso você seja um Cliente
  let conexaoHost = null;

  function adicionarMensagem(remetente, texto, classe = "") {
    const div = document.createElement("div");
    div.classList.add("msg");
    if (classe) div.classList.add(classe);
    div.innerHTML = `<span class="nome">${remetente}:</span> ${texto}`;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function iniciarChat() {
    // 1. Tenta se registrar com o ID fixo do Servidor/Host
    peer = new Peer(FIXED_ROOM_ID);

    peer.on("open", id => {
      // Se registrou com sucesso com o ID fixo, VOCÊ é o Servidor/Host
      isHost = true;
      statusDiv.innerHTML = `Status: <b>Servidor HostAtivo</b> (Você criou a sala)`;
      adicionarMensagem("Sistema", "Você é o Host da sala. Aguardando participantes...", "sistema");

      // Escuta conexões de novos clientes
      peer.on("connection", conn => {
        conexoesAtivas.push(conn);

        conn.on("open", () => {
          adicionarMensagem("Sistema", `Um novo participante entrou na sala.`, "sistema");
        });

        conn.on("data", data => {
          // Quando o Host recebe uma mensagem, ele exibe na sua tela...
          adicionarMensagem(data.nome, data.texto);
          // ...e retransmite (broadcast) para TODOS os outros clientes conectados
          transmitirParaTodos(data);
        });

        conn.on("close", () => {
          const index = conexoesAtivas.indexOf(conn);
          if (index > -1) conexoesAtivas.splice(index, 1);
          adicionarMensagem("Sistema", "Um participante saiu.", "sistema");
        });
      });
    });

    // 2. Se der erro de 'unavailable-id', significa que o ID fixo JÁ EXISTE (já tem um Host)
    peer.on("error", err => {
      if (err.type === "unavailable-id") {
        // ID Ocupado! Nós seremos um CLIENTE e vamos nos conectar ao Host existente
        conectarComoCliente();
      } else {
        console.error("Erro PeerJS:", err);
        statusDiv.innerHTML = `Erro: ${err.type}`;
      }
    });
  }

  function conectarComoCliente() {
    // Cria um Peer com ID aleatório para este cliente
    peer = new Peer();

    peer.on("open", () => {
      isHost = false;
      statusDiv.innerHTML = `Status: <b>Conectado ao Servidor</b>`;

      // Conecta automaticamente ao ID Fixo do Host
      conexaoHost = peer.connect(FIXED_ROOM_ID);

      conexaoHost.on("open", () => {
        adicionarMensagem("Sistema", "Conectado ao chat global com sucesso!", "sistema");
      });

      // Recebe mensagens transmitidas pelo Host
      conexaoHost.on("data", data => {
        adicionarMensagem(data.nome, data.texto);
      });

      conexaoHost.on("close", () => {
        statusDiv.innerHTML = `Status: <b>Desconectado</b>`;
        adicionarMensagem("Sistema", "A conexão com o Host foi perdida.", "sistema");
      });

      conexaoHost.on("error", err => {
        adicionarMensagem("Sistema", `Erro na conexão com Host: ${err.message}`, "sistema");
      });
    });
  }

  // Função do Host para enviar a mensagem recebida para todos
  function transmitirParaTodos(data) {
    conexoesAtivas.forEach(conn => {
      if (conn.open) {
        conn.send(data);
      }
    });
  }

  function enviar() {
    const texto = msgInput.value.trim();
    if (!texto) return;

    const data = { nome, texto };

    if (isHost) {
      // Se for o Host, exibe localmente e envia para todos os clientes
      adicionarMensagem(nome, texto);
      transmitirParaTodos(data);
    } else if (conexaoHost && conexaoHost.open) {
      // Se for Cliente, envia para o Host (que irá retransmitir)
      conexaoHost.send(data);
    } else {
      adicionarMensagem("Sistema", "Você ainda não está conectado a nenhuma sala.", "sistema");
      return;
    }

    msgInput.value = "";
  }

  msgInput.addEventListener("keydown", e => {
    if (e.key === "Enter") {
      e.preventDefault();
      enviar();
    }
  });

  // Inicia o processo de conexão
  iniciarChat();
</script>
</body>
</html>
